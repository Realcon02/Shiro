services:
  db:
    image: docker.io/postgres:17-alpine
    container_name: postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "6000:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - app_network

  bot:
    build: .
    container_name: shiro
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - app_network

volumes:
  pgdata:

networks:
  app_network: